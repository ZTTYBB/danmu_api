name: Fork Sync

permissions:
    contents: write

concurrency:
    group: fork-sync-${{ github.repository }}
    cancel-in-progress: false

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v4
              with:
                ref: main
                fetch-depth: 0

            - name: Sync upstream while preserving fork workflows
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch --no-tags origin main
                  git checkout --detach origin/main
                  base_sha="$(git rev-parse HEAD)"
                  git fetch --no-tags https://github.com/huangxd-/danmu_api.git main
                  upstream_sha="$(git rev-parse FETCH_HEAD)"

                  if git merge-base --is-ancestor "$upstream_sha" HEAD; then
                      echo "Already up to date with upstream." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  if ! git merge --no-ff --no-commit "$upstream_sha"; then
                      mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
                      if [ "${#conflicts[@]}" -eq 0 ]; then
                          echo "::error::Upstream merge failed."
                          exit 1
                      fi
                      for path in "${conflicts[@]}"; do
                          if [[ "$path" != .github/workflows/* ]]; then
                              echo "::error file=$path::Resolve this upstream merge conflict manually."
                              exit 1
                          fi
                      done
                  fi

                  # Keep fork automation unchanged, including removal of new upstream workflows.
                  # The merge still records upstream as a parent for the next incremental sync.
                  git restore --source="$base_sha" --staged --worktree -- .github/workflows
                  git diff --cached --exit-code "$base_sha" -- .github/workflows
                  git commit --no-edit
                  git push origin HEAD:refs/heads/main
                  echo "Synced upstream $upstream_sha into $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"

            - name: Check for new commits
              if: success()
              run: echo "Sync completed successfully"

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. This might be due to:"
                  echo "1. Merge conflicts outside .github/workflows"
                  echo "2. A concurrent update to main"
                  echo "3. Network or repository permission issues"
                  echo "Please check the logs and consider manual sync if needed."
                  exit 1
